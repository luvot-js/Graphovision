version: "3.8"

# 로컬 통합 실행용 (Phase 6)
# 사용법: docker-compose up --build
# 백엔드: http://localhost:8000
# 프론트: http://localhost:5173

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./data:/project/data   # SQLite DB + 업로드 이미지 영속화

  frontend:
    build:
      context: ./GraphoVision_UI
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
